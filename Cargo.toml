[package]
name = "ai-world"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[[bin]]
name = "aiw"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
libc = "0.2.189"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
toml = "0.9.12"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
security-framework-sys = "2.15.0"
